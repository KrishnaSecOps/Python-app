apiVersion: apps/v1
kind: Deployment
metadata:
  name: pythonapp
  namespace: pythonns
  labels:
    app: pythonapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pythonapp
  template:
    metadata:
      labels:
        app: pythonapp
    spec:
      containers:
      - name: pythonapp
        image: krishnasecops/pythonapp:1.0
